exclude: ^\.local_pkgs/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: detect-private-key
        exclude: ^(docs/configuration\.md|tests/sftp/test_client\.py)$

  - repo: https://github.com/crate-ci/typos
    rev: b859c0df7f391deba73030f79b957e62b4d81dc6  # varcon-core-v5.0.7  # pragma: allowlist secret
    hooks:
      - id: typos
        # The changelog is auto-generated by towncrier; its issue reference
        # links contain hyphen-separated truncated words in ticket slugs that
        # typos consistently flags as false positives.
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/ --strict
        language: unsupported
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright src/ tests/
        language: unsupported
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: zizmor
        name: zizmor
        entry: uv tool run zizmor
        language: unsupported
        args: ["."]
        types: [yaml]
        pass_filenames: false

  - repo: local
    hooks:
      - id: uv-audit
        name: uv audit
        # --preview-features audit-command: uv ≥0.12 requires the flag; older
        # versions accept it without error, so this is safe to pass always.
        entry: uv --preview-features audit-command audit
        # CVE-2025-69872 / GHSA-w8v5-vhqr-4h9v: diskcache unsafe pickle deserialization.
        # No fix version available; ignored until a patched release is published.
        # aiohttp 3.14.1: GHSA-mfx4-hv73-q22v, GHSA-mq44-7p77-q5h7 (both fixed in 3.14.2),
        #   GHSA-cq5v-8q36-5273 (fixed in 3.14.3).
        # cryptography 49.0.0: GHSA-g6cj-pr64-35w5 (CVE-2026-69247, fixed in 50.0.0).
        args:
          [
            "--ignore-until-fixed", "GHSA-w8v5-vhqr-4h9v",
            "--ignore-until-fixed", "GHSA-mfx4-hv73-q22v",
            "--ignore-until-fixed", "GHSA-mq44-7p77-q5h7",
            "--ignore-until-fixed", "GHSA-cq5v-8q36-5273",
            "--ignore-until-fixed", "GHSA-g6cj-pr64-35w5",
          ]
        language: unsupported
        pass_filenames: false
        files: ^uv\.lock$

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.96.0
    hooks:
      - id: trufflehog
        args: ["--config=.trufflehog.yaml"]

  - repo: local
    hooks:
      - id: vulture
        name: vulture
        # --min-confidence 80 drops noisy 60% findings (dynamically-set
        # dunders on built tool functions, pydantic model fields) that are
        # false positives; genuine dead code reports at 90%+.
        entry: vulture --ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py --min-confidence 80
        language: unsupported
        pass_filenames: false

  - repo: local
    hooks:
      - id: modules-registration
        name: modules registration
        description: >-
          Verify every file in the repo is claimed by at least one
          module in docs/modules.yaml — catches newly created files
          that were not registered before commit.
        entry: uv run robotsix-modules check-registration docs/modules.yaml --root .
        language: unsupported
        pass_filenames: false

  - repo: local
    hooks:
      - id: regenerate-config-schema
        name: regenerate config schema
        entry: bash -c "uv run scripts/regenerate_schema.py && git add config/config.schema.json"
        language: unsupported
        files: ^src/robotsix_chat/config/settings\.py$
        pass_filenames: false
        fail_fast: true

  - repo: local
    hooks:
      - id: update-changelog-sha256
        name: update changelog SHA256
        entry: bash -c "uv run scripts/update_changelog_sha256.py && git add docs/system_prompt_changelog.md"
        language: unsupported
        files: ^src/robotsix_chat/config/settings\.py$
        pass_filenames: false
        fail_fast: true

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
        types: [markdown]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--number", "--wrap", "100"]
        # CHANGELOG.md is generated by the auto-release workflow (towncrier)
        # and never edited by hand (repo baseline); reformatting it here
        # turns every release commit into a red main.  Same for the
        # towncrier fragment directory — fragments are auto-generated
        # one-liners.
        exclude: ^(CHANGELOG\.md|changelog\.d/.*|docs/system_prompt_changelog\.md)$
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
