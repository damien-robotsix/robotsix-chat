exclude: ^\.local_pkgs/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: detect-private-key
        exclude: ^(docs/configuration\.md|tests/sftp/test_client\.py)$

  - repo: https://github.com/crate-ci/typos
    rev: b859c0df7f391deba73030f79b957e62b4d81dc6  # varcon-core-v5.0.7  # pragma: allowlist secret
    hooks:
      - id: typos
        # The changelog is auto-generated by release-please; its issue reference
        # links contain hyphen-separated truncated words in ticket slugs that
        # typos consistently flags as false positives.
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/ --strict
        language: unsupported
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright src/ tests/
        language: unsupported
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: zizmor
        name: zizmor
        entry: uv tool run zizmor
        language: unsupported
        args: ["."]
        types: [yaml]
        pass_filenames: false

  # Shared audit hooks: both read the single-source repo-root .audit-ignore
  # (also used by ci.yml's python-ci.yml audit and dependency-audit.yml).
  # uv-audit runs `uv audit --frozen --preview` with every .audit-ignore id
  # passed as --ignore-until-fixed; audit-ignore-check validates the file
  # (format, reasons, expiry). Keep `rev` on the python-ci.yml release that
  # ci.yml calls.
  - repo: https://github.com/damien-robotsix/robotsix-github-workflows
    rev: 86a722f2938c1dda343bbf8d3c5989613cbf1794  # frozen: v1.5.0
    hooks:
      - id: audit-ignore-check
      - id: uv-audit

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.99.3
    hooks:
      - id: trufflehog
        args: ["--exclude-detectors=Lob"]

  - repo: local
    hooks:
      - id: vulture
        name: vulture
        # --min-confidence 80 drops noisy 60% findings (dynamically-set
        # dunders on built tool functions, pydantic model fields) that are
        # false positives; genuine dead code reports at 90%+.
        entry: vulture --ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py --min-confidence 80
        language: unsupported
        pass_filenames: false

  - repo: local
    hooks:
      - id: modules-registration
        name: modules registration
        description: >-
          Verify every file in the repo is claimed by at least one
          module in docs/modules.yaml — catches newly created files
          that were not registered before commit.
        entry: uv run robotsix-modules check-registration docs/modules.yaml --root .
        language: unsupported
        pass_filenames: false

  - repo: local
    hooks:
      - id: regenerate-config-schema
        name: regenerate config schema
        entry: bash -c "uv run robotsix-config schema robotsix_chat.config.Settings && git add config/config.schema.json"
        language: unsupported
        files: ^src/robotsix_chat/config/settings\.py$
        pass_filenames: false
        fail_fast: true

  - repo: local
    hooks:
      - id: update-changelog-sha256
        name: update changelog SHA256
        entry: bash -c "uv run scripts/update_changelog_sha256.py && git add docs/system_prompt_changelog.md"
        language: unsupported
        files: ^src/robotsix_chat/config/settings\.py$
        pass_filenames: false
        fail_fast: true

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
        types: [markdown]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "100"]
        # CHANGELOG.md is generated by the auto-release workflow (release-please)
        # and never hand-edited; docs/system_prompt_changelog.md is machine-appended
        # by the prompt-governance workflow (carrying SHA256 records) — reformatting
        # either would turn every release/governance commit into a red main.
        exclude: ^(CHANGELOG\.md|docs/system_prompt_changelog\.md)$
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter

  - repo: https://github.com/damien-robotsix/robotsix-standards
    rev: v0.10.0
    hooks:
      - id: check-secret-str
