name: "CodeQL config"
paths-ignore:
  - ".local-deps/**"
  - ".local_pkgs/**"
query-filters:
- exclude:
    id: py/clear-text-storage-sensitive-data
# False positives on this repo's module-size-scan refactor patterns:
# - py/unused-import: façade modules (e.g. subsessions/worker.py) re-export
#   underscore-prefixed symbols via the ``import X as X`` form for sibling
#   modules/tests to consume; CodeQL does not treat these re-exports as uses.
# - py/unused-global-variable: module-private constants (e.g. _CLASSIFY_*,
#   _RETRY_PROMPT_TEMPLATE, test _69BE_* fixtures) are defined in one module
#   and consumed only via cross-module import, which CodeQL does not count.
- exclude:
    id: py/unused-import
- exclude:
    id: py/unused-global-variable
# - py/cyclic-import: the subsessions/worker.py façade is split into sibling
#   modules (continuation, turn_runner, slot_budget_wiring, subsession_types,
#   worker_periodic, subsession_waits, ...) that reach back into the façade
#   only via function-level deferred imports or ``TYPE_CHECKING`` blocks,
#   which are safe at runtime; CodeQL still reports these as import cycles.
- exclude:
    id: py/cyclic-import
