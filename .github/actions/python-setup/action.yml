name: Python setup
description: |
  Set up Python and uv for the shared python-ci.yml reusable workflow.

  This composite action is called by the shared
  damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml
  reusable workflow as a repo-local action (``uses: ./.github/actions/python-setup``).
  It centralises the Python + uv bootstrap so callers don't duplicate it.

inputs:
  python-version:
    description: Python version to install (passed through to setup-uv)
    required: false
    default: "3.14"
  uv-version:
    description: uv version to install
    required: false
    default: "latest"
  install-extras:
    description: Comma-separated extras to pass to ``uv sync --extra``
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        python-version: ${{ inputs.python-version }}
        version: ${{ inputs.uv-version }}

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_EXTRAS: ${{ inputs.install-extras }}
      run: |
        set -euo pipefail
        if [ -n "${INSTALL_EXTRAS}" ]; then
          uv sync --frozen --extra "${INSTALL_EXTRAS}"
        else
          uv sync --frozen
        fi
