name: Auto-format

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: auto-format-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  format:
    name: Auto-format with ruff
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only reads the checkout; the push below uses a scoped App
    # token. A GITHUB_TOKEN push lands as github-actions[bot] and GitHub parks
    # every workflow run on that head as `action_required` (workflow approval)
    # — chat PR #1933 sat blocked for 27 h on 2026-09-09/10 with all 8 runs
    # waiting for a click. Events created by an App token run CI normally
    # (robotsix-standards release-please.md: "The token must not be
    # GITHUB_TOKEN").
    permissions:
      contents: read
    # Skip for fork PRs — no token of ours can push to an external fork.
    # Skip for dependabot PRs too: a pull_request run triggered by dependabot
    # only sees Dependabot secrets, so secrets.RELEASE_APP_PRIVATE_KEY is
    # empty and the token mint fails ("The 'private-key' input must be set
    # to a non-empty string") — every dependabot PR carried a red
    # Auto-format from #1942 (2026-09-11) until 2026-10-22, which made
    # repo-hygiene hold the whole dependabot queue. Dependabot commits are
    # lock/workflow bumps that never need formatting.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - name: Install
        run: uv sync --frozen
      - name: Run ruff format
        run: uv run ruff format .
      - name: Run ruff check --fix
        run: uv run ruff check --fix .
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scoped: an unscoped token inherits the App's blanket installation
          # permissions (zizmor github-app, high).
          permission-contents: write
      - name: Commit and push formatting fixes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-format with ruff" --no-verify
            # `persist-credentials: false` leaves `origin` without credentials,
            # so push through an authenticated remote URL, App token first.
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
          fi
