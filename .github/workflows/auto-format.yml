name: Auto-format

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: auto-format-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  format:
    name: Auto-format with ruff
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push formatting fixes to the PR branch
    # Skip for fork PRs — GITHUB_TOKEN cannot push to external forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install
        run: uv sync --frozen
      - name: Run ruff format
        run: uv run ruff format .
      - name: Run ruff check --fix
        run: uv run ruff check --fix .
      - name: Commit and push formatting fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-format with ruff" --no-verify
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push origin HEAD
          fi
