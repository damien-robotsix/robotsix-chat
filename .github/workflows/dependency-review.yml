name: Dependency Review

on:
  pull_request:

permissions:
  contents: read  # baseline: checkout the repo

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency Review (shared)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read        # checkout the repo
      pull-requests: write  # PR summary comment from dependency-review
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependency-review.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      fail-on-severity: moderate
      comment-summary-in-pr: true
      allow-licenses: >-
        MIT,
        MIT-CMU,
        Apache-2.0,
        BSD-2-Clause,
        BSD-3-Clause,
        ISC,
        Python-2.0,
        0BSD,
        Unlicense,
        HPND-Markus-Kuhn
      # Per-package license allowances (allow-dependencies-licenses) and their
      # justifications live in the config file: the shared workflow has no
      # matching input for them.
      config-file: ./.github/dependency-review-config.yml
