name: Dependency Review

on:
  pull_request:

permissions:
  contents: read  # baseline: checkout the repo

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout the repo
      pull-requests: write  # post comment-summary-in-pr
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true
          allow-licenses: >-
            MIT,
            MIT-CMU,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            Python-2.0,
            0BSD,
            Unlicense,
            HPND-Markus-Kuhn
          # mdformat-frontmatter, mdit-py-plugins, and ruamel-yaml are all MIT-
          # licensed but the dependency-review-action cannot detect their
          # license from PyPI metadata — explicitly allow them.
          # reportlab is BSD-3-Clause (permissive, OSI-approved) but declares
          # its license as freeform "BSD license (see license.txt)" metadata
          # that cannot be mapped to an SPDX id — explicitly allow it.
          allow-dependencies-licenses: >-
            pkg:pypi/mdformat-frontmatter@2.1.2,
            pkg:pypi/mdit-py-plugins@0.6.1,
            pkg:pypi/ruamel-yaml@0.19.1,
            pkg:pypi/reportlab@5.0.1
