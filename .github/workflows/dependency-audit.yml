name: Scheduled dependency audit

# The blocking CVE audit in ci.yml only runs on PRs that touch uv.lock or
# pyproject.toml (and on push to main), so a newly published advisory against
# an already-pinned transitive dependency no longer fails unrelated PRs.
# This workflow closes the resulting gap: it audits main's lockfile daily and,
# when an advisory is found, fails (red run) AND opens — or comments on — a
# single tracking issue so the advisory is remediated by a dependency-bump PR
# instead of being silently ignored.

on:
  schedule:
    # Daily at 05:00 UTC.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency CVE audit (main)
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
      issues: write   # open/comment on the advisory tracking issue
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Checkout workflow library (audit-ignore parser)
        # scripts/audit_ignore.py from robotsix-github-workflows — the same
        # parser python-ci.yml's audit uses — pinned to the python-ci.yml
        # release ci.yml calls (keep the two SHAs in step).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: damien-robotsix/robotsix-github-workflows
          ref: 86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
          path: _workflow-lib
          persist-credentials: false
      - name: Audit dependencies
        # Ignored advisories come from the single-source repo-root
        # .audit-ignore (shared with ci.yml's python-ci.yml audit and the
        # uv-audit pre-commit hook); audit_ignore.py appends each id as
        # --ignore-until-fixed and fails on malformed or expired entries.
        run: |
          set -euo pipefail
          python3 _workflow-lib/scripts/audit_ignore.py --format uv -- \
            uv --preview-features audit-command audit --frozen \
            2>&1 | tee audit.log
      - name: Open or update the advisory tracking issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            const title = 'Dependency audit: new advisory against main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let log = '(audit log unavailable — see the run)';
            try {
              log = fs.readFileSync('audit.log', 'utf8').slice(-6000);
            } catch (e) {}
            const body = [
              `The scheduled dependency audit failed on \`main\`: ${runUrl}`,
              '',
              'A newly published advisory affects a pinned dependency. Bump the',
              'affected package (`uv lock --upgrade-package <pkg>`), or — only when',
              'no fixed release exists — add an `ID  # reason` line to the',
              'repo-root `.audit-ignore` file.',
              '',
              '```',
              log,
              '```',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`Opened issue #${issue.number}`);
            }
