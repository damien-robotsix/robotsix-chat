name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # baseline: checkout the repo; the docs job needs more

# Callers own concurrency: the reusable python-docs.yml defines none.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Docs
    permissions:
      contents: read  # checkout the repo
      pages: write    # configure-pages (read) + deploy-pages in the called workflow
      id-token: write  # OIDC token for the Pages deployment
    # Builds with `mkdocs build --strict` and deploys to GitHub Pages
    # (deploy skipped on pull_request).
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      docs-install-args: "--group docs"
      # Align with the [tool.uv] required-version pin (uv 0.12.19); the shared
      # workflow defaults to an older uv, which `uv sync` then refuses to run.
      uv-version: "0.12.19"
