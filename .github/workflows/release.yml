name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read  # baseline: checkout the repo

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag and CI status
    runs-on: ubuntu-latest
    permissions:
      checks: read    # query CI check-run status
      contents: read  # checkout the repo
      actions: read   # getWorkflowRun for check-suite id
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches pyproject.toml version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag '$TAG' does not match pyproject version '$version'"
            exit 1
          fi
          if ! grep -qE "^## \[?$version\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section for version '$version'"
            exit 1
          fi
      - name: Verify CI status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fn = require('./.github/scripts/verify-ci.js');
            await fn({github, context, core});

  sbom:
    name: Generate and submit SBOM
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload-artifact + submit SBOM to dependency graph
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false

      - name: Generate CycloneDX SBOM
        run: uv export --format cyclonedx1.5 --frozen -o sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom.cdx.json
          path: sbom.cdx.json

      - name: Submit SBOM to Dependency Graph
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: ./
          format: cyclonedx-json
          dependency-snapshot: true

# No `publish` job on purpose: the stack publishes to no package index
# (robotsix-standards repo baseline) — the component ships as a container
# image via release-image.yml; libraries are consumed from git.
