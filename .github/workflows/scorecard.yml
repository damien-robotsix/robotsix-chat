name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'

# Least-privilege rather than the upstream template's `read-all`: chat's
# zizmor runs with --persona=pedantic, which flags read-all as
# excessive-permissions. These four are what scorecard-action documents as
# required; checks that need more (Branch-Protection) are skipped, exactly
# as they are under read-all without a PAT.
permissions: {}

# One analysis at a time per ref. cancel-in-progress stays false: a
# scheduled run that gets cancelled publishes nothing, which would leave
# the public score stale rather than merely late.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openssf-scorecard:
    # Name kept identical to the job id on purpose: a display name that
    # differs renames the status-check context, which strands any branch
    # protection rule that referenced the old one.
    name: openssf-scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read  # scorecard reads workflow runs
      contents: read  # checkout
      id-token: write  # publish results to the OpenSSF API
      security-events: write  # upload SARIF to Code Scanning
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v3
        with:
          sarif_file: results.sarif
