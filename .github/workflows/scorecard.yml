name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'

permissions: {}

# One analysis at a time per ref. cancel-in-progress stays false: a
# scheduled run that gets cancelled publishes nothing, which would leave
# the public score stale rather than merely late.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openssf-scorecard:
    name: Scorecard analysis (shared)
    # A calling job's permissions REPLACE the workflow-level block rather
    # than merging with it, so the top-level `permissions: {}` does NOT
    # apply here — the callee declares contents:read + security-events:write,
    # and granting only the latter made GitHub reject the call before it
    # started (startup_failure, which emits no logs and no check runs).
    permissions:
      contents: read  # checkout inside the called workflow
      security-events: write  # upload Scorecard SARIF to Code Scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/scorecard.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0