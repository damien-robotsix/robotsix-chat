name: Scorecard

on:
  schedule:
    - cron: '30 1 * * 6'  # weekly Saturday 01:30 UTC
  push:
    branches: [main]       # needed for Branch-Protection check
  branch_protection_rule:  # trigger on rule changes
  workflow_dispatch:        # manual trigger

permissions: {}

concurrency:
  group: "scorecards-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # OIDC for publish_results verification
      security-events: write   # upload SARIF to code-scanning dashboard
      contents: read
      actions: read           # scorecard reads workflow run data
      issues: read           # scorecard checks for security-policy.md
      pull-requests: read    # scorecard reads PR metadata
      checks: read           # scorecard reads check run results

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: results.sarif
          category: scorecard

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
          if-no-files-found: error
