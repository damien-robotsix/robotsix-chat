name: Weekly container vulnerability rescan
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions: {}

concurrency:
  group: scan-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rescan:
    name: Weekly Trivy rescan (shared)
    # A calling job's permissions REPLACE the workflow-level block rather
    # than merging with it, so the top-level `contents: read` did NOT apply
    # here — the callee declares contents:read + security-events:write, and
    # granting only the latter made GitHub reject the call before it started
    # (startup_failure, which emits no logs and no check runs).
    permissions:
      contents: read  # checkout inside the called workflow
      security-events: write  # upload Trivy SARIF to Code Scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/scan-container.yml@454851ccfdba26ba4d08f3effea09258dfc3fe2f  # main
