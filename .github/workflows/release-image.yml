name: Release image

# Publishes the container image to GHCR.  Hand-rolled (not the shared
# docker-release.yml reusable workflow) because the shared workflow's
# docker/build-push-action with push: true does NOT load the image into the
# local Docker daemon — Trivy then has to pull the multi-GB image back from
# GHCR before scanning, which exhausts the runner's /tmp or triggers
# preemption on ubuntu-latest runners (4 recurring CI failures: #423, #559,
# #750, plus this one).  Building with load: true first and tagging with a
# plain (non-registry-qualified) tag ensures Trivy resolves via the local
# Docker daemon instead of pulling from GHCR; the second build (push: true)
# reuses the buildx cache and is fast.
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read  # baseline: checkout the repo

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: never publish an image from a commit whose CI is red.
  verify:
    name: Verify CI is green
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      checks: read    # query CI check-run status
      contents: read  # checkout the repo
      actions: read   # getWorkflowRun for check-suite id
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify CI status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fn = require('./.github/scripts/verify-ci.js');
            await fn({github, context, core});

  publish:
    name: Build, scan, and publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read          # checkout the repo
      packages: write         # push image to GHCR
      attestations: write     # provenance / SBOM attestation
      id-token: write         # provenance / SBOM attestation signing
      security-events: write  # Trivy SARIF upload to Code Scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "::group::Setup Docker Buildx (attempt ${attempt} of 3)"
            # Remove any partially-created builder from a prior failed attempt.
            docker buildx rm -f builder 2>/dev/null || true
            # Create the builder with the docker-container driver and bootstrap
            # it.  The bootstrap step reaches out to Docker Hub to pull the
            # buildkit container image -- this is where transient timeouts occur.
            if docker buildx create --use --name builder --driver docker-container && \
               docker buildx inspect --bootstrap 2>&1; then
              echo "::endgroup::"
              echo "Buildx ready (attempt ${attempt})"
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 3 ]; then
              echo "Bootstrap failed, retrying in 15s..."
              sleep 15
            fi
          done
          echo "Buildx setup failed after 3 attempts"
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          # No GHA layer cache: exporting this multi-GB image's layers to the
          # cache API takes 45-55 min per run while a cold build takes ~4 min.
          # Measured 2026-07-03; do not re-add without re-timing.

      - name: Tag local image for Trivy scanning
        id: scan-ref
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          FIRST_TAG="$(echo "${TAGS}" | head -1)"
          echo "Local image tag: ${FIRST_TAG}"
          docker tag "${FIRST_TAG}" "local/robotsix-chat:scan"
          echo "image=local/robotsix-chat:scan" >> "$GITHUB_OUTPUT"

      # Gate policy (docker standard): block only on CRITICAL/HIGH findings
      # with a released fix — a red gate always means "an upgrade exists,
      # take it".  Unfixable base-image CVEs stay visible via the SARIF run
      # below but do not block.
      - name: Trivy scan (gate)
        id: trivy-gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.scan-ref.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          vuln-type: os,library

      - name: Trivy scan (SARIF for code-scanning)
        if: always() && steps.scan-ref.outputs.image != ''
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.scan-ref.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release

      - name: Push image to GHCR (with provenance + SBOM)
        if: steps.trivy-gate.outcome == 'success'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
