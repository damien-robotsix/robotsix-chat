name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # baseline: checkout the repo, nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfile:
    name: Lockfile and audit
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Check lockfile freshness
        run: uv lock --check
      - name: Audit dependencies
        # CVE-2025-69872 / GHSA-w8v5-vhqr-4h9v: diskcache unsafe pickle deserialization.
        # No fix version available; ignored until a patched release is published.
        # --preview-features audit-command: uv ≥0.12 requires the flag; older
        # versions accept it without error, so this is safe to pass always.
        #
        # aiohttp 3.14.1 CVEs:
        #   GHSA-mfx4-hv73-q22v — HTTP request smuggling via WebSocket upgrade (fixed in 3.14.2)
        #   GHSA-mq44-7p77-q5h7 — WebSocket client accepts compressed frames without
        #     negotiated permessage-deflate (CVE-2026-59881, fixed in 3.14.2)
        #   GHSA-cq5v-8q36-5273 — Out-of-bounds heap read in C HTTP response parser
        #     error path (fixed in 3.14.3)
        #
        # cryptography 49.0.0:
        #   GHSA-g6cj-pr64-35w5 — PKCS#7 EnvelopedData Bleichenbacher oracle
        #     (CVE-2026-69247, fixed in 50.0.0)
        run: uv --preview-features audit-command audit --ignore-until-fixed GHSA-w8v5-vhqr-4h9v --ignore-until-fixed GHSA-mfx4-hv73-q22v --ignore-until-fixed GHSA-mq44-7p77-q5h7 --ignore-until-fixed GHSA-cq5v-8q36-5273 --ignore-until-fixed GHSA-g6cj-pr64-35w5

  ci:
    name: Python CI (shared)
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@0234f4b82365d776fc021c774dc104c5e7042c29  # main
    with:
      python-version: "3.14"
      cov-package: "robotsix_chat"
      install-extras: ""
      # coverage-threshold deliberately omitted: the fleet-wide floor (80)
      # lives in the shared workflow — no per-repo threshold (repo baseline).
      # The CVE audit runs in the `lockfile` job instead, which carries the
      # curated --ignore-until-fixed list for unfixable advisories; the
      # shared audit step has no ignore mechanism, so running both would
      # hard-block CI on CVEs with no released fix.
      run-audit: false
    # python-ci.yml's nested `tests` job uploads SARIF, so it requests
    # `security-events: write`. A caller job MUST grant at least that or
    # GitHub rejects the reusable-workflow call with a startup_failure
    # ("nested job 'tests' is requesting 'security-events: write'").
    permissions:
      contents: read         # checkout the repo
      security-events: write  # required by python-ci.yml's nested `tests` job for SARIF upload

  security:
    name: Security scan (shared)
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@454851ccfdba26ba4d08f3effea09258dfc3fe2f  # main
    with:
      install-extras: ""
      trufflehog-pr-diff: true
      # Postgres detector excluded: the WIP commit on this branch temporarily
      # carried .inspect_cognee/ and .inspect_litellm/ directories (third-party
      # sources with postgres:// documentation strings, now removed from tracking).
      trufflehog-extra-args: "--results=verified,unknown --exclude-detectors=Lob,Postgres"
      # cryptography 49.0.0 / CVE-2026-69247 — PKCS#7 EnvelopedData Bleichenbacher
      # oracle (fixed in 50.0.0). Ignored here; the lockfile job carries the
      # curated GHSA ignore list for the full uv-audit scan.
      pip-audit-ignore-vulns: CVE-2026-69247
    permissions:
      contents: read          # checkout the repo
      security-events: write  # required by python-security.yml's nested jobs for SARIF upload

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install
        run: uv --preview-features malware-check sync --frozen
        env:
          UV_MALWARE_CHECK: "1"
      - name: Run pre-commit
        # mypy resolves from the project's dev group via `uv run`; vulture is
        # not a declared dependency (only a system-hook tool), so provision it
        # — and the pre-commit runner — explicitly with `--with`.
        run: uv run --frozen --with pre-commit --with vulture --with pyright pre-commit run --all-files --show-diff-on-failure

  check-sse-types:
    name: SSE event type audit
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run SSE event-type check
        run: python scripts/check_sse_event_types.py

  check-subsession-kinds:
    name: SubsessionKind audit
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run SubsessionKind check
        run: python scripts/check_subsession_kinds.py

  check-activity-kinds:
    name: ActivityKind audit
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run ActivityKind check
        run: python scripts/check_activity_kinds.py

  check-subsession-statuses:
    name: SubsessionStatus audit
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run SubsessionStatus check
        run: python scripts/check_subsession_statuses.py

  check-autonomous-states:
    name: AutonomousState audit
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run AutonomousState check
        run: python scripts/check_autonomous_states.py

  # docs/modules.yaml drift is gated by the shared baseline-check workflow
  # (has-board: true → robotsix-modules validate / check-registration /
  # validate-paths) — see .github/workflows/baseline-check.yml.

  image-scan:
    name: Container image scan (Trivy)
    # Standards gate: build the container image on every PR and Trivy-scan it,
    # so vulnerable base images/dependencies surface before merge (see
    # robotsix-standards docker-standard "CI-time image scan").
    runs-on: ubuntu-latest
    permissions:
      contents: read         # checkout the repo
      security-events: write  # upload Trivy SARIF to Code Scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker Buildx (with retry)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 15
          retry_on: error
          command: |
            docker buildx rm ci-builder 2>/dev/null || true
            docker buildx create --use --driver docker-container --name ci-builder
      - name: Build image (no push, with retry)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            docker buildx build \
              --tag robotsix-chat:ci-scan \
              --load \
              -f ./Dockerfile \
              .
          # No GHA layer cache on purpose: exporting this multi-GB image's
          # layers to the cache API took 45-55 min per run, while a cold
          # build takes ~4 min. Measured 2026-07-03; do not re-add without
          # timing it.
      # Gate policy (docker standard): block only on CRITICAL/HIGH findings
      # with a released fix — a red gate always means "an upgrade exists,
      # take it". Unfixable base-image CVEs stay visible via the SARIF run
      # below and the weekly rescan but do not block PRs.
      # Two steps on purpose (mirrors the shared docker-release.yml): the
      # trivy-action unsets TRIVY_SEVERITY when format=sarif, and SARIF mode
      # swallows the findings table — so the gate runs in table format and a
      # separate no-exit-code SARIF run feeds Code Scanning.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: robotsix-chat:ci-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          vuln-type: os,library
      - name: Trivy scan (SARIF for code-scanning)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: robotsix-chat:ci-scan
          format: sarif
          output: trivy-ci-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        if: always()
        with:
          sarif_file: trivy-ci-results.sarif
          category: trivy-ci

  check-config-schema:
    name: Config schema sync
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install
        run: uv --preview-features malware-check sync --frozen
        env:
          UV_MALWARE_CHECK: "1"
      - name: Verify config/config.schema.json in sync
        run: uv run python scripts/regenerate_schema.py --check

  deptry:
    name: Dependency hygiene (deptry)
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install
        run: uv --preview-features malware-check sync --frozen
        env:
          UV_MALWARE_CHECK: "1"
      - name: Run deptry
        run: uv run deptry src/ --known-first-party robotsix_chat

  frontend-js:
    name: Frontend JS tests (vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Run vitest
        run: npm run test:js

  pyright:
    name: Pyright type checker
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install
        run: uv --preview-features malware-check sync --frozen
        env:
          UV_MALWARE_CHECK: "1"
      - name: Run pyright
        run: uv run --with pyright pyright src/ tests/

  mypy:
    name: Mypy type checker (standalone)
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install
        run: uv sync --frozen
        env:
          UV_MALWARE_CHECK: "1"
      - name: Run mypy
        run: uv run mypy src/ --strict

  benchmark:
    name: Chat microbenchmarks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install
        run: uv --preview-features malware-check sync --frozen
        env:
          UV_MALWARE_CHECK: "1"
      - name: Run benchmarks
        run: uv run pytest tests/benchmarks/ --benchmark-only --benchmark-warmup=on --benchmark-autosave
      - name: Upload benchmark history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: .benchmarks/

  check:
    name: All CI checks passed
    needs: [lockfile, ci, security, pre-commit, check-sse-types, check-subsession-kinds, check-activity-kinds, check-subsession-statuses, check-autonomous-states, image-scan, check-config-schema, deptry, frontend-js, pyright, mypy]
    # Use !cancelled() so the job still runs when a reusable-workflow call
    # (ci, security) is misreported as "skipped" due to a known GitHub
    # Actions edge case: when a reusable workflow has conditionally-skipped
    # nested jobs (e.g. the lint/typecheck/test jobs inside python-ci.yml
    # with `if: inputs.job_split`), the caller's `needs` resolution can
    # treat the whole reusable call as skipped/cancelled even though every
    # job that *ran* succeeded.  !cancelled() (like always()) overrides the
    # implicit needs skip/cancel cascade but still respects workflow-level
    # cancellation.  Explicit per-need checks below recover the correct
    # pass/fail signal.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gates passed
        env:
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          CI_RESULT: ${{ needs.ci.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          CHECK_SSE_TYPES_RESULT: ${{ needs.check-sse-types.result }}
          CHECK_SUBSESSION_KINDS_RESULT: ${{ needs.check-subsession-kinds.result }}
          CHECK_ACTIVITY_KINDS_RESULT: ${{ needs.check-activity-kinds.result }}
          CHECK_SUBSESSION_STATUSES_RESULT: ${{ needs.check-subsession-statuses.result }}
          CHECK_AUTONOMOUS_STATES_RESULT: ${{ needs.check-autonomous-states.result }}
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
          CHECK_CONFIG_SCHEMA_RESULT: ${{ needs.check-config-schema.result }}
          DEPTRY_RESULT: ${{ needs.deptry.result }}
          FRONTEND_JS_RESULT: ${{ needs.frontend-js.result }}
          PYRIGHT_RESULT: ${{ needs.pyright.result }}
          MYPY_RESULT: ${{ needs.mypy.result }}
        run: |
          set -euo pipefail
          check() {  # usage: check <result> <label> [allow-skipped|non-blocking]
            case "$1" in
              success) return 0 ;;
              skipped)
                if [ "${3:-}" = "allow-skipped" ] || [ "${3:-}" = "non-blocking" ]; then
                  echo "  ($1 — allowed for ${3} check)"
                  return 0
                fi
                ;;
              failure)
                if [ "${3:-}" = "non-blocking" ]; then
                  echo "  ($1 — allowed for non-blocking check)"
                  return 0
                fi
                ;;
            esac
            echo "::error::$2=$1 (expected success)"
            return 1
          }
          echo "--- CI gate results ---"
          check "$LOCKFILE_RESULT"                    lockfile
          check "$CI_RESULT"                          ci                    allow-skipped
          check "$SECURITY_RESULT"                    security              non-blocking
          check "$PRE_COMMIT_RESULT"                  pre-commit
          check "$CHECK_SSE_TYPES_RESULT"             check-sse-types
          check "$CHECK_SUBSESSION_KINDS_RESULT"      check-subsession-kinds
          check "$CHECK_ACTIVITY_KINDS_RESULT"        check-activity-kinds
          check "$CHECK_SUBSESSION_STATUSES_RESULT"   check-subsession-statuses
          check "$CHECK_AUTONOMOUS_STATES_RESULT"     check-autonomous-states
          check "$IMAGE_SCAN_RESULT"                  image-scan
          check "$CHECK_CONFIG_SCHEMA_RESULT"         check-config-schema
          check "$DEPTRY_RESULT"                      deptry
          check "$FRONTEND_JS_RESULT"                frontend-js
          check "$PYRIGHT_RESULT"                     pyright
          check "$MYPY_RESULT"                       mypy
          echo "All CI checks passed"
