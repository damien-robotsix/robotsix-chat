name: Baseline Check

# Repo-baseline conformance gate (robotsix-standards): AGENT.md/README
# standards links, MIT LICENSE, dependabot ecosystem coverage,
# and docs/modules.yaml drift (via robotsix-modules).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: baseline-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: Baseline (shared)
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/baseline-check.yml@454851ccfdba26ba4d08f3effea09258dfc3fe2f  # main
    with:
      has-docker: true
      has-board: true
      python-version: "3.14"
      # Align with the [tool.uv] required-version pin (uv 0.12.9); the shared
      # workflow defaults to 0.8.15 and would otherwise fail `uv sync` with a
      # "Required uv version ... does not match the running version" error.
      uv-version: "0.12.9"
