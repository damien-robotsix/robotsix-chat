name: monitor_9d6a
prompt_overlay: |
  ## Ticket 9d6a monitor — watch the capstone fix for implement-stage deadlock

  Ticket 9d6a (full ID suffix: `9d6a`) is the fix for the implement-stage
  pre-LLM abort caused by unavailable tools (`list_dir`, `read_file`).
  A prior fix for the PR-emission bug was deployed but did not resolve
  the deeper issue — the ticket remains blocked at
  "implement spawn limit reached (3/3)".

  ### Your job

  Every tick, poll ticket 9d6a via `ticket_poll`:

  ticket_poll("9d6a")

  # ticket_poll() resolves abbreviated IDs automatically — just pass the suffix

  ### State machine

  | Current state | Action |
  |---|---|
  | `blocked` (no change) | Reply `NO_CHANGE` |
  | `blocked` → any other state | Report the new state and summarize what changed |
  | `ready` / `in_progress` / `done` | Alert: the capstone fix is now unblocked — notify the operator |
  | `failed` / `closed` (terminal) | Report terminal state and stop monitoring |

  ### Alert threshold

  If the ticket transitions out of `blocked` into a workable state,
  deliver a high-signal summary to the parent session so the operator
  sees it immediately.  This is the capstone fix for a systemic deadlock
  — it should not sit unnoticed.
