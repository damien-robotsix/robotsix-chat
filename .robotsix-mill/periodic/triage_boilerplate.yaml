name: triage_boilerplate
prompt_overlay: |
  ## Cycle-ceiling pattern detection — systemic review-stage replay

  When two or more separate tickets hit the 10/10 implement/review cycle
  ceiling with the **same reviewer-blocking rationale** in a short
  timeframe (days, not weeks), escalate immediately as a potential
  systemic review-stage replay bug rather than attempting per-ticket
  fixes.

  ### Why this matters

  A stale cached review verdict can replay `REQUEST_CHANGES` verbatim
  across every cycle even after the implementation has changed. The
  symptom is a phantom rejection — the reviewer demands something that
  was already fixed, or that the implement agent deletes by design
  (e.g. towncrier fragments on a release-please repo). The underlying
  cache hit makes the new reviewer code invisible; every cycle replays
  the same pre-fix outcome until the ticket burns its ceiling.

  The per-ticket fix in these cases is to invalidate the stage cache
  (the root cause has already been patched in the reviewer). Filing
  yet another "implement the requested change" ticket is counter-
  productive — it cycles through the same cached verdict again.

  ### Detection rules

  1. Scan tickets that reached the 10/10 implement/review ceiling
     (state `done` with `termination_reason: ceiling` or equivalent).
  2. Group by the reviewer's blocking rationale (the note text from
     the final `REQUEST_CHANGES` outcome).
  3. If ≥2 tickets in the same timeframe share the same rationale,
     file ONE escalation draft — not one per ticket.

  ### Escalation draft

  Title: "Potential review-stage replay: N tickets hit cycle ceiling
  with identical reviewer rationale"

  Body:
  - List the ticket IDs
  - Quote the shared blocking rationale
  - Note the timeframe
  - Recommend invalidating the stage cache for those tickets rather
    than filing per-ticket implement drafts

  ### When NOT to apply

  - A single isolated ticket hitting the ceiling (no shared rationale
    with any sibling).
  - Tickets with different blocking rationales (true per-ticket issues,
    not a systemic replay).
  - The reviewer rationale is demonstrably valid and the implement
    agent genuinely failed to address it each cycle.

  ## AppShell adoption — missing `appshell-loader.js` integration guidance

  When two or more AppShell adoption tickets across different repos
  hit the same post-implementation verification failure mentioning
  "appshell-loader.js", escalate as a systemic guidance gap: the
  ticket spec did not include the canonical integration point, so
  the implement agent had no way to place the file correctly.

  ### Why this matters

  An AppShell adoption ticket that omits the canonical integration
  point (file path, loader name, and expected symbol) forces the
  implement agent to guess.  The post-implementation verification
  step catches the resulting error (`summary verification failed
  after retry: appshell-loader.js`), but the ticket has already
  burned a full implement cycle (budget, wall-clock time, and
  operator attention).  The fix is always the same: a manual resume
  that pastes the integration guidance into the ticket spec.

  ### Detection rules

  1. Scan tickets whose title, description, or verification failure
     note mentions ``appshell-loader.js`` or ``appshell``.
  2. Group by the same failure rationale (e.g. "summary verification
     failed after retry: appshell-loader.js").
  3. If ≥2 tickets in different repos share the same failure within
     a short timeframe, file ONE escalation draft.

  ### Canonical integration point for `appshell-loader.js`

  Every AppShell adoption ticket spec MUST include these three fields
  drawn from the target version's package structure:

  | Field            | Value (v0.1.40 example)                            |
  | ---------------- | --------------------------------------------------- |
  | **File path**    | `node_modules/appshell/dist/appshell-loader.js`     |
  | **Loader name**  | `AppShellLoader`                                    |
  | **Expected symbol** | Default export (the `AppShellLoader` class)       |

  The canonical file path, loader name, and expected symbol MUST
  be verified against the actual package structure of the version
  being adopted — the values above are for v0.1.40 and may change
  in later versions.  Before drafting an AppShell adoption ticket,
  inspect the target version's ``package.json`` ``"main"`` / ``"exports"``
  fields and the ``dist/`` or ``lib/`` directory layout to confirm
  the exact path and export shape.

  ### Escalation draft

  Title: "AppShell adoption tickets missing canonical integration
  guidance — N tickets hit verification failure"

  Body:
  - List the ticket IDs and repos
  - Quote the shared verification failure message
  - Note the timeframe
  - Recommend that the ticket spec for each blocked ticket be
    amended to include the canonical integration point (file path,
    loader name, expected symbol) drawn from the AppShell version
    being adopted, so the implement agent can place
    ``appshell-loader.js`` correctly without guessing.

  ### When NOT to apply

  - A single isolated AppShell verification failure (may be a
    one-off implement error rather than a systemic gap).
  - The ticket spec already includes the canonical integration
    point and the implement agent still failed — that is a
    per-ticket implement error, not a guidance gap.
